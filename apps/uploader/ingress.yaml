apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uploader
  namespace: ynoacamino
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/redirect-entry-point: https

spec:
  tls:
    - hosts:
        - uploader.ynoacamino.tech
      secretName: uploader-tls

  rules:
    - host: uploader.ynoacamino.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uploader
                port:
                  number: 80
