apiVersion: apps/v1
kind: Deployment

metadata:
  name: evoapi-cache
  namespace: fluia
  labels:
    app: evoapi-cache

spec:
  replicas: 1
  selector:
    matchLabels:
      app: evoapi-cache
  template:
    metadata:
      labels:
        app: evoapi-cache
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - name: redis
              containerPort: 6379
